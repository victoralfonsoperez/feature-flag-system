services:
  - type: web
    name: kanary-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        sync: false
      - key: PORT
        value: "3100"
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
